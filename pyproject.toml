[project]
name = "synapstock"
version = "0.1.0"
description = "Universal Mindmap Orchestrator connecting News and Stocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "mypy>=1.19.1",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "responses>=0.26.0",
    "ruff>=0.15.5",
    "types-requests>=2.32.4.20260107",
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.42.0",
    "jinja2>=3.1.6",
    "beautifulsoup4>=4.14.3",
    "websockets>=16.0",
    "python-multipart>=0.0.22",
    "pandas>=3.0.1",
    "openpyxl>=3.1.5",
    "playwright>=1.58.0",
    "pytest-playwright>=0.7.2",
    "pycryptodome>=3.23.0",
    "google-api-python-client>=2.155.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "python-telegram-bot>=21.10",
    "httpx>=0.28.1",
]

[project.scripts]
synapstock = "synapstock.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapstock"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
