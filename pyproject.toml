[project]
name = "evenezer"
version = "0.1.0"
description = "Universal Mindmap Orchestrator connecting News and Stocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "responses>=0.26.0",
    "types-requests>=2.32.4.20260107",
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.42.0",
    "jinja2>=3.1.6",
    "beautifulsoup4>=4.14.3",
    "websockets>=16.0",
    "python-multipart>=0.0.22",
    "pandas>=3.0.1",
    "openpyxl>=3.1.5",
    "pycryptodome>=3.23.0",
    "google-api-python-client>=2.155.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "python-telegram-bot>=21.10",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "plotly",
]

[project.scripts]
evenezer = "evenezer.presentation.web.server:run_server"
evenezer-bot = "evenezer.presentation.telegram.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evenezer"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "types-beautifulsoup4>=4.12.0.20250516",
    "ruff>=0.15.5",
    "ty>=0.0.32",
    "radon>=6.0.1",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ["tests"]
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E402"] # 모듈 레벨 임포트 위치 에러는 일부 파일에서 의도적이므로 무시하거나 개별 처리
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -q --asyncio-mode=strict"
markers = [
    "unit: 유닛 테스트 (외부 의존성 없음)",
    "integration: 통합 테스트 (DB, API, 파일 등 외부 연동 포함)"
]
